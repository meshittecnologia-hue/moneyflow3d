name: Verificação

on:
  pull_request:
  push:
    branches: [Desenvolvimento, main]

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regras 1 e 2 + varredura de segredos
        run: python3 scripts/validar_html.py admin.html index.html lp.html privacidade.html termos.html
      - name: Preços iguais a planos.js (item 24)
        run: python3 scripts/validar_precos.py admin.html index.html lp.html js/*.js
      - name: Carimbos de versão dos arquivos js/css (item 16)
        run: python3 scripts/versionar.py --checar
      - name: Teste do app no navegador (todas as páginas, sem erro de JavaScript)
        run: |
          cd scripts/navegador
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node teste_app.js
      - name: Testes do webhook da Kiwify
        run: node --experimental-strip-types --no-warnings --test supabase/functions/webhook-kiwify/webhook.test.mjs

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
