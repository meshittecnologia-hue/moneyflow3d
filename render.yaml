# Blueprint do Render: cria a API Python a partir deste repositório.
services:
  - type: web
    name: moneyflow3d-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://fqthlewarcqvmqojmzzs.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        value: https://moneyflow3d.com.br
      - key: ALLOWED_ORIGINS
        value: https://moneyflow3d.com.br

  # ── Homologação (item 2.2): mesma API, ligada à branch Desenvolvimento e ao Supabase moneyflow3d-dev.
  - type: web
    name: moneyflow3d-api-dev
    runtime: python
    plan: free
    branch: Desenvolvimento
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://ilpjwzbiqbngimnsonfv.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        value: https://moneyflow3d-web-dev.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://moneyflow3d-web-dev.onrender.com

  # Site de homologação: os mesmos HTML da branch Desenvolvimento.
  - type: web
    name: moneyflow3d-web-dev
    runtime: static
    branch: Desenvolvimento
    buildCommand: mkdir -p site && cp index.html admin.html lp.html planos.js site/ && cp -r js css site/
    staticPublishPath: site
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      # Item 25: CSP em modo aviso (não bloqueia; manda violações ao Sentry). Igual a scripts/csp.txt
      # + report-uri. O painel do Render NÃO lê este arquivo sozinho: mudou aqui, mude lá também.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://moneyflow3d-api.onrender.com https://moneyflow3d-api-dev.onrender.com https://*.ingest.us.sentry.io https://docs.google.com https://*.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri https://o4512408484577280.ingest.us.sentry.io/api/4512408490868736/security/?sentry_key=2b7ba99e3331b79cbf989b58c48ea14b&sentry_environment=homologacao"
